# Portainer stack. The image is built on the Docker host from this repo
# (docker build -t worldseed:latest .) since Portainer's agent cannot run
# compose builds; the stack then just runs it.
services:
  worldseed:
    image: worldseed:latest
    pull_policy: never
    container_name: worldseed
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - worldseed-data:/data
    ports:
      - "8089:3000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  worldseed-data:
