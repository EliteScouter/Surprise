# Portainer stack. Both images are built on the Docker host from this repo
# (Portainer's agent cannot run compose builds):
#   docker build -t worldseed:latest .
#   docker build -t cosmonym-gate:latest -f gate/Dockerfile .
#
# Network layout:
#   internet -> Cloudflare -> NPM -> [gate :8089] -> (internal network) -> [app]
# The app has no route to the LAN or the internet; only the gate can reach it.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gate:
    <<: *hardening
    image: cosmonym-gate:latest
    pull_policy: never
    container_name: cosmonym-gate
    environment:
      # "all" while testing on the LAN; set to the reverse proxy IP (10.0.101.1)
      # once cosmonym.app is live so nothing else can reach the site.
      GATE_ALLOW: ${GATE_ALLOW:-all}
      NPM_PROXY: ${NPM_PROXY:-10.0.101.1}
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    ports:
      - "8089:8080"
    networks:
      - edge
      - internal
    mem_limit: 128m
    pids_limit: 64
    cpus: 1
    depends_on:
      - app

  app:
    <<: *hardening
    image: worldseed:latest
    pull_policy: never
    container_name: cosmonym-app
    user: "1000:1000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      # Only the gate (the sole other member of the internal network) may vouch
      # for a visitor's IP.
      TRUSTED_PROXIES: 172.31.89.0/29
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-https://cosmonym.app}
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - worldseed-data:/data
    networks:
      - internal
    mem_limit: 768m
    pids_limit: 128
    cpus: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  edge:
  internal:
    internal: true          # no gateway: nothing on it can reach the LAN or internet
    ipam:
      config:
        - subnet: 172.31.89.0/29

volumes:
  worldseed-data:
