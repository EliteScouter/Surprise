# Overwrite (never append to) anything a client sent, so the app only ever sees
# the IP this gate established.
proxy_set_header Host              $http_host;
proxy_set_header CF-Connecting-IP  $forward_ip;
proxy_set_header X-Forwarded-For   $forward_ip;
proxy_set_header X-Real-IP         $forward_ip;
proxy_set_header X-Forwarded-Proto $forward_proto;
